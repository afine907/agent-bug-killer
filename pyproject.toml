[project]
name = "agent-bug-killer"
version = "0.2.0"
description = "AI-Powered Bug Diagnosis Agent — 不只监控，更要诊断"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["ai", "agent", "bug", "diagnosis", "debugging", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "deepagents>=0.1",
    "paramiko>=3.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/afine907/agent-bug-killer"
Documentation = "https://github.com/afine907/agent-bug-killer/tree/main/docs"
Repository = "https://github.com/afine907/agent-bug-killer"
Issues = "https://github.com/afine907/agent-bug-killer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scenarios"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scenarios/*/tests", "core/tests", "api/tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may need external services)",
    "e2e: End-to-end tests (full flow)",
]
